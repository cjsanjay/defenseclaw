schema_version: 1
registry_version: 1
bucket_catalog_version: 1
imports:
  - genai.yaml
  - security.yaml
  - operations.yaml
dependency_lock: schemas/telemetry/v8/semconv.lock.yaml
examples: examples.yaml
semantic_profiles:
  - id: defenseclaw-genai-rich-v1
    trace_schema_version: defenseclaw-trace-v1
    gen_ai_semconv_profile: otel-genai-b028dceecdad117461a785c3af35315e7184e813
    openinference_profile: openinference-semantic-conventions-v0.1.30
    galileo_compatibility_profile: galileo-rich-v2
conditions:
  - id: connector-known-v1
    description: The producer or adapter has a canonical connector identity.
    enforcement: {kind: builder_fact, fact: connector_known}
    false_requirement: forbidden
  - id: operation-terminal-v1
    description: The bounded operation has reached a terminal state.
    enforcement: {kind: builder_fact, fact: operation_terminal}
    false_requirement: optional
  - id: technical-failure-v1
    description: The operation ended because of a technical failure.
    enforcement: {kind: builder_fact, fact: technical_failure}
    false_requirement: optional
  - id: guardrail-terminal-decision-available-v1
    description: The guardrail producer supplied a terminal domain decision.
    enforcement: {kind: builder_fact, fact: guardrail_terminal_decision_available}
    false_requirement: forbidden
  - id: security-severity-available-v1
    description: The producer supplied or the adapter canonically normalized security severity.
    enforcement: {kind: builder_fact, fact: security_severity_available}
    false_requirement: forbidden
  - id: judge-output-parse-failed-v1
    description: The judge output could not be parsed into the registered result shape.
    enforcement: {kind: builder_fact, fact: judge_output_parse_failed}
    false_requirement: forbidden
  - id: admin-principal-known-v1
    description: The authenticated administrative principal is known.
    enforcement: {kind: builder_fact, fact: admin_principal_known}
    false_requirement: forbidden
mandatory_rule_catalog:
  version: 1
  rules:
    - {id: always, enforcement: {kind: constant, value: true}}
    - {id: control_plane_mutation, enforcement: {kind: builder_fact, fact: control_plane_mutation}}
    - {id: approval_resolution, enforcement: {kind: builder_fact, fact: approval_resolution}}
    - {id: alert_mutation, enforcement: {kind: builder_fact, fact: alert_mutation}}
    - {id: protected_boundary_auth_failure, enforcement: {kind: builder_fact, fact: protected_boundary_auth_failure}}
    - {id: enforced_outcome, enforcement: {kind: builder_fact, fact: enforced_outcome}}
    - {id: enforcement_state_change, enforcement: {kind: builder_fact, fact: enforcement_state_change}}
    - {id: schema_validation_failure, enforcement: {kind: builder_fact, fact: schema_validation_failure}}
    - {id: sqlite_failure, enforcement: {kind: builder_fact, fact: sqlite_failure}}
    - {id: exporter_initialization_failure, enforcement: {kind: builder_fact, fact: exporter_initialization_failure}}
    - {id: durable_health_transition, enforcement: {kind: builder_fact, fact: durable_health_transition}}
value_catalogs:
  - id: agent-phase-v1
    kind: string-int64-bijection
    value_attributes: [defenseclaw.agent.phase, defenseclaw.agent.phase.previous, defenseclaw.agent.phase.from, defenseclaw.agent.phase.to]
    paired_value_attribute: defenseclaw.agent.phase
    code_attribute: defenseclaw.agent.phase.code
    entries:
      - {value: session, code: 1}
      - {value: planning, code: 2}
      - {value: model, code: 3}
      - {value: tool, code: 4}
      - {value: approval, code: 5}
      - {value: waiting, code: 6}
      - {value: responding, code: 7}
      - {value: maintenance, code: 8}
      - {value: completed, code: 9}
      - {value: failed, code: 10}
      - {value: interrupted, code: 11}
      - {value: observed, code: 12}
    compatibility: {value: unknown, code: 0, canonical_emittable: false}
structured_types:
  - id: gen_ai.canonical_json
    kind: canonical_json
    introduced_in: telemetry-registry-v1
    discriminator: {visibility: internal, wire: false}
    arms: [boolean, int64, finite_double, string, array, object]
    leaf_privacy: {field_class: content, sensitivity: sensitive}
    array: {items_ref: gen_ai.canonical_json}
    object:
      members:
        member_id: entry
        name:
          type: string
          field_class: identifier
          sensitivity: internal
          normalization: {id: bounded-v1, overrides: {max_utf8_bytes: 256}}
        value: {structured_ref: gen_ai.canonical_json}
      public_encoding: ordered_typed_entries
      wire_encoding: native_object_properties
    limits:
      max_depth: 8
      max_aggregate_members: 256
      max_array_items: 256
      max_string_utf8_bytes: 4096
      max_member_name_utf8_bytes: 256
      max_item_bytes: 32768
      max_canonical_bytes: 65536
