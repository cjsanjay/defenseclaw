      trace_resource.schema_url: ResourceSpans
      trace_scope.schema_url: ResourceSpans.scopeSpans[]
    timestamp_encoding: decimal_unix_nano_string
    id_encoding: lowercase_hex
    span_kind_mapping:
      - {canonical: INTERNAL, otlp: 1}
      - {canonical: SERVER, otlp: 2}
      - {canonical: CLIENT, otlp: 3}
      - {canonical: PRODUCER, otlp: 4}
      - {canonical: CONSUMER, otlp: 5}
    status_code_mapping:
      - {canonical: UNSET, otlp: 0}
      - {canonical: OK, otlp: 1}
      - {canonical: ERROR, otlp: 2}
    signals:
      - {signal: logs, mode: projected_record_json_string, request_root: resourceLogs}
      - {signal: traces, mode: direct_span, request_root: resourceSpans}
      - {signal: metrics, mode: sdk_aggregation_required, request_root: resourceMetrics}
normalizers:
  - id: identity-v1
    kind: identity
    default_constraints: {}
    allowed_overrides:
      - min_items
      - max_items
  - id: bounded-v1
    kind: bounded
    default_constraints:
      max_utf8_bytes: 4096
      max_item_utf8_bytes: 4096
      max_items: 256
    allowed_overrides:
      - max_utf8_bytes
      - max_item_utf8_bytes
      - min_items
      - max_items
      - pattern
  - id: enum-v1
    kind: enum
    default_constraints:
      max_utf8_bytes: 256
    allowed_overrides:
      - enum
      - max_utf8_bytes
  - id: identifier-v1
    kind: identifier
    default_constraints:
      max_utf8_bytes: 256
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]*$'
    allowed_overrides:
      - max_utf8_bytes
      - pattern
  - id: numeric-range-v1
    kind: numeric_range
    default_constraints: {}
    allowed_overrides:
      - min
      - max
      - min_items
      - max_items
  - id: structured-content-v1
    kind: structured_content
    default_constraints:
      max_utf8_bytes: 65536
      max_item_utf8_bytes: 4096
      max_items: 256
      max_depth: 8
      max_properties: 256
    allowed_overrides:
      - max_utf8_bytes
      - max_item_utf8_bytes
      - min_items
      - max_items
      - max_depth
      - max_properties
  - id: redacted-content-v1
    kind: redacted_content
    default_constraints:
      max_utf8_bytes: 65536
      max_item_utf8_bytes: 4096
      max_items: 256
      max_depth: 8
      max_properties: 256
    allowed_overrides:
      - max_utf8_bytes
      - max_item_utf8_bytes
      - min_items
      - max_items
      - max_depth
      - max_properties
  - id: path-v1
    kind: path
    default_constraints:
      max_utf8_bytes: 4096
    allowed_overrides:
      - max_utf8_bytes
  - id: url-v1
    kind: url
    default_constraints:
      max_utf8_bytes: 8192
    allowed_overrides:
      - max_utf8_bytes
  - id: digest-v1
    kind: digest
    default_constraints:
      max_utf8_bytes: 256
      pattern: '^[A-Za-z0-9][A-Za-z0-9:+._/-]*$'
    allowed_overrides:
      - max_utf8_bytes
      - pattern
metric_defaults:
  cardinality_limit: 2048
metric_compatibility_profiles:
  - id: local-observability-v1
    high_cardinality_families:
      - family: defenseclaw.agent.last_seen
        labels:
          - defenseclaw.connector.source
          - defenseclaw.agent.execution.id
          - defenseclaw.agent.lifecycle.id
          - defenseclaw.agent.parent.id
          - defenseclaw.agent.root.id
          - defenseclaw.session.root.id
          - gen_ai.agent.id
          - gen_ai.agent.name
          - defenseclaw.agent.type
      - family: defenseclaw.agent.lifecycle.transitions
        labels:
          - defenseclaw.connector.source
          - defenseclaw.agent.depth
          - defenseclaw.agent.execution.id
          - defenseclaw.agent.lifecycle.event
